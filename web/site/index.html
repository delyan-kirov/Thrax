<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thrax, a tour</title>
<style>
  :root {
    --bg: #16181d; --panel: #1e2128; --card: #191c22; --ink: #e6e6e6;
    --dim: #8b93a1; --accent: #7cc4ff; --ok: #7bd88f; --err: #ff6b6b;
    --line: #2a2e37; --kw: #c8a6ff;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 22px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    max-width: 1080px; margin: 0 auto;
  }
  header h1 { font-size: 22px; margin: 0; letter-spacing: .5px; }
  header .tag { color: var(--dim); font-size: 14px; }
  header a { color: var(--accent); text-decoration: none; font-size: 14px; margin-left: auto; }
  header a:hover { text-decoration: underline; }
  main { max-width: 1080px; margin: 0 auto; padding: 8px 20px 80px; }
  .intro { color: var(--dim); font-size: 15px; margin: 22px 2px 30px; max-width: 70ch; }
  .intro strong { color: var(--ink); font-weight: 600; }

  .cell { margin: 0 0 34px; }
  .cell .prose { margin: 0 2px 12px; }
  .cell .prose h2 {
    font-size: 16px; margin: 0 0 6px; letter-spacing: .3px;
    display: flex; align-items: baseline; gap: 10px;
  }
  .cell .prose h2 .n {
    color: var(--dim); font-variant-numeric: tabular-nums;
    font-weight: 500; font-size: 13px;
  }
  .cell .prose p { margin: 0; color: var(--dim); max-width: 74ch; }

  .io {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    background: var(--line); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden;
  }
  .pane { display: flex; flex-direction: column; background: var(--card); min-width: 0; }
  .bar {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .bar .label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .8px; }
  .bar .spacer { flex: 1; }
  button {
    font: inherit; font-size: 12.5px; color: var(--ink); background: #262a33;
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer;
  }
  button.run { background: var(--accent); color: #0c1116; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  textarea, pre.out {
    margin: 0; padding: 13px 14px; border: 0;
    font-family: var(--mono); font-size: 13px; line-height: 1.55;
    background: transparent; color: var(--ink); tab-size: 4;
  }
  textarea {
    resize: none; outline: none; overflow: hidden; white-space: pre;
    min-height: 64px; width: 100%;
  }
  pre.out {
    flex: 1; overflow: auto; white-space: pre-wrap; word-break: break-word;
    min-height: 64px; color: var(--dim);
  }
  pre.out .err { color: var(--err); }
  pre.out.has-out { color: var(--ink); }
  .status { font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--err); }
  code {
    font-family: var(--mono); font-size: .9em; color: var(--kw);
    background: #21252e; padding: 1px 5px; border-radius: 4px;
  }
  .prose code { background: #20242c; }
  footer {
    max-width: 1080px; margin: 0 auto; padding: 0 22px 60px;
    color: var(--dim); font-size: 13px;
  }
  footer a { color: var(--accent); text-decoration: none; }

  @media (max-width: 720px) {
    .io { grid-template-columns: 1fr; }
    textarea { white-space: pre; overflow-x: auto; }
  }
</style>
</head>
<body>
<header>
  <h1>Thrax</h1>
  <span class="tag">effects in a functional style</span>
  <a href="https://github.com/delyan-kirov/Thrax" target="_blank" rel="noopener">source &rarr;</a>
</header>

<main>
  <p class="intro">
    Explore the examples below by modifying any of them. You'll see the
    output (or error message) on the right after clicking <strong>Run</strong>
    or pressing <code>&#8984;/Ctrl + Enter</code>.
  </p>
  <div id="notebook"></div>
</main>

<footer>
  <span id="boot">Loading the compiler runtime&hellip;</span>
</footer>

<script type="module">
import { CELLS } from "./cells.mjs";
import { createHost } from "./host.mjs";

// Hand-written glue for the Rust compiler wasm (web/playground): a
// wasm32-unknown-unknown cdylib with a raw C-ABI over linear memory. No
// wasm-bindgen, no emscripten. `host` owns the `@extern` registry the compiled
// program calls into; the page is free to register more host functions.
const host = createHost();

// Minimal inline formatting for prose: escape HTML, then `code` -> <code>.
function fmt(s) {
  const esc = s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc.replace(/`([^`]+)`/g, "<code>$1</code>");
}

function grow(ta) {
  // Measuring the natural height needs a momentary collapse to `auto`, which
  // shortens the document and makes the browser re-anchor the scroll. Restore
  // the scroll position so the page doesn't jump on every keystroke.
  const y = window.scrollY;
  ta.style.height = "auto";
  ta.style.height = ta.scrollHeight + "px";
  window.scrollTo(window.scrollX, y);
}

// Build every cell's DOM up front; wire behavior once the runtime is ready.
const runners = [];
const nb = document.getElementById("notebook");

CELLS.forEach((cell, i) => {
  const sec = document.createElement("section");
  sec.className = "cell";
  sec.innerHTML = `
    <div class="prose">
      <h2><span class="n">${String(i + 1).padStart(2, "0")}</span>${fmt(cell.title)}</h2>
      <p>${fmt(cell.blurb)}</p>
    </div>
    <div class="io">
      <div class="pane">
        <div class="bar">
          <span class="label">program</span>
          <span class="spacer"></span>
          <button class="clear" title="reset this program to the original">Reset</button>
          <button class="run" disabled>&#9654; Run</button>
        </div>
        <textarea spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      </div>
      <div class="pane">
        <div class="bar">
          <span class="label">output</span>
          <span class="spacer"></span>
          <span class="status"></span>
        </div>
        <pre class="out"></pre>
      </div>
    </div>`;
  nb.appendChild(sec);

  const ta = sec.querySelector("textarea");
  const out = sec.querySelector(".out");
  const runBtn = sec.querySelector(".run");
  const clearBtn = sec.querySelector(".clear");
  const status = sec.querySelector(".status");
  ta.value = cell.src;
  requestAnimationFrame(() => grow(ta));
  ta.addEventListener("input", () => grow(ta));

  runners.push({ ta, out, runBtn, clearBtn, status, src: cell.src, module: null });
});

function setStatus(r, text, cls) {
  r.status.textContent = text;
  r.status.className = "status" + (cls ? " " + cls : "");
}

// One shared wasm instance; each cell compiles independently.
try {
  const res = await fetch("playground.wasm");
  const { instance } = WebAssembly.instantiateStreaming
    ? await WebAssembly.instantiateStreaming(res.clone(), host.imports).catch(
        async () => WebAssembly.instantiate(await res.arrayBuffer(), host.imports))
    : await WebAssembly.instantiate(await res.arrayBuffer(), host.imports);
  host.bind(instance.exports);
} catch (e) {
  document.getElementById("boot").innerHTML =
    "The Thrax compiler failed to load. Serve this page over http:// with " +
    "<code>playground.wasm</code> beside it (build it with <code>cargo build -p " +
    "playground --target wasm32-unknown-unknown --release</code>).";
  throw e;
}

function runCell(r) {
  setStatus(r, "running…");
  let text;
  try {
    text = host.compile(r.ta.value, 0); // 0 = run the program
  } catch (e) {
    r.out.textContent = "the compiler trapped: " + e + " (reload the page)";
    r.out.classList.add("has-out");
    setStatus(r, "trapped", "bad");
    return;
  }
  const isErr = /error|mismatch|unbound|cannot|fault|unavailable|has no `test`/i
    .test(text.split("\n")[0]);
  r.out.textContent = "";
  const span = document.createElement("span");
  if (isErr) span.className = "err";
  span.textContent = text;
  r.out.appendChild(span);
  r.out.classList.toggle("has-out", text.length > 0);
  setStatus(r, isErr ? "error" : "ok", isErr ? "bad" : "ok");
}

for (const r of runners) {
  r.runBtn.disabled = false;
  r.runBtn.onclick = () => runCell(r);
  // Reset restores the original program and re-runs it.
  r.clearBtn.onclick = () => {
    r.ta.value = r.src;
    grow(r.ta);
    runCell(r);
  };
  r.ta.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); runCell(r); }
  });
  runCell(r); // pre-fill outputs so the page reads like a notebook
}

document.getElementById("boot").innerHTML =
  "Ready. This whole page is powered by the Thrax compiler (the Rust rewrite) " +
  "running as WebAssembly in your browser. " +
  "<a href=\"https://github.com/delyan-kirov/Thrax\">Read the source</a>.";
</script>
</body>
</html>
