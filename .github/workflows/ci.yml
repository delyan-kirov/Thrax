name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27

      # cargo test runs the workspace suites (frontend, interpreter end-to-end,
      # ccg).
      - name: Build and test in Nix dev shell
        run: |
          nix develop --command bash -c '
            set -e
            cargo test
          '
