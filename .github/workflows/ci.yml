name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # cargo test runs the workspace suites (frontend, interpreter end-to-end,
      # ccg). The corpus and the grammar are separate: neither is reachable from
      # cargo, so without these steps a break in the examples, the standard
      # library, or the syntax spec reaches master unnoticed.
      - name: Build and test in Nix dev shell
        run: |
          nix develop --command bash -c '
            set -e
            cargo test
          '

      # tests/MAIN.thx links every examples/*.thx (its `$ @build` reads the
      # directory, so the list cannot drift) and must give identical output on the
      # interpreter and the compiled C program.
      - name: Corpus on both engines
        run: |
          nix develop --command bash -c '
            set -e
            cargo build --release
            THRAX_BIN=./target/release/thrax ./target/release/thrax run tools/THXDO.thx corpus
          '

      # documentation/thrax.y is the written syntax standard; `%expect` fails the
      # check when the conflict count moves.
      - name: Grammar spec
        run: |
          nix develop --command bash -c '
            set -e
            bison -o /dev/null documentation/thrax.y
          '

  # The corpus compiled for wasm32-wasi with emscripten and run under node,
  # against the interpreter. tests/EXCEPTIONS.thx lists what wasm cannot run.
  wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Corpus as wasm32-wasi
        run: |
          nix develop --command bash -c '
            set -e
            cargo build --release
            THRAX_BIN=./target/release/thrax ./target/release/thrax run tools/THXDO.thx corpus wasm
          '

  # The browser playground: the compiler and its language server built to
  # wasm32-unknown-unknown, then the headless smoke test that runs every tour
  # cell through it and drives the server. It lives in the applications
  # submodule. The crate's own tests run natively first; they catch what the
  # wasm build cannot, such as a standard-library module the playground misses.
  playground:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: cachix/install-nix-action@v31

      - name: Build the playground and smoke-test it
        run: |
          nix develop ./applications/web --command bash -c '
            set -e
            (cd applications && cargo test -p playground)
            node applications/web/build.ts
          '

  # macOS, natively, in the smaller shell of tools/macos/flake.nix.
  #
  # macOS is not well supported. Nobody on the project develops on a Mac, and
  # this job is the only place the port is exercised. Known gap (#327): the two
  # ThreadSanitizer tests in crates/ccg/tests/compile.rs fail here. The
  # instrumented binaries exit unsuccessfully at THRAX_THREADS=2 with nothing on
  # stderr, so TSan reports no race and the runtime prints no fault. The same
  # programs pass without TSan on this runner, and pass under TSan on Linux.
  # Giving workers the 512 KiB macOS stack on Linux did not reproduce it, and
  # the cause is unknown. We do not have the resources to debug it on Apple
  # hardware, so the tests skip on macOS and the Linux job's TSan run covers
  # the shared runtime C.
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Test
        run: nix develop ./tools/macos --command cargo test

      - name: Corpus on both engines
        run: |
          nix develop ./tools/macos --command bash -c '
            set -e
            cargo build --release
            THRAX_BIN=./target/release/thrax ./target/release/thrax run tools/THXDO.thx corpus
          '

  # Windows, natively, with the MSYS2 UCRT64 MinGW-w64 toolchain: the gcc that
  # `thrax build` calls, Rust for that toolchain, and libffi.
  windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      # The corpus compares output byte for byte, so sources keep their LF.
      - name: Keep LF line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-libffi
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Test
        run: cargo test

      - name: Corpus on both engines
        run: |
          set -e
          cargo build --release
          THRAX_BIN=./target/release/thrax.exe ./target/release/thrax.exe run tools/THXDO.thx corpus

  # The cross build from Linux (tools/windows/flake.nix) that the Windows
  # release ships, run under Wine.
  windows-cross:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Corpus under Wine
        run: nix develop ./tools/windows --command thrax-wine-corpus

  # A red master opens one `ci-failure` issue, the one to commit the fix
  # against. Later red runs comment on it rather than opening more, and the
  # next green master closes it.
  report:
    needs: [build, wasm, playground, macos, windows, windows-cross]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      issues: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NEEDS: ${{ toJSON(needs) }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Open, update or close the ci-failure issue
        run: |
          failed=$(printf '%s' "$NEEDS" | jq -r 'to_entries[] | select(.value.result == "failure") | .key' | paste -sd, - | sed 's/,/, /g')
          open=$(gh issue list --label ci-failure --state open --json number --jq '.[0].number // empty')
          note="Failing: ${failed}. Commit ${GITHUB_SHA::7}, run $RUN"
          if [ -n "$failed" ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "Still red. $note"
            else
              gh label create ci-failure --color d73a4a --description "master is red" --force
              gh issue create --title "CI fails on master" --label ci-failure --body "$note"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Green again at ${GITHUB_SHA::7}, run $RUN"
          fi
