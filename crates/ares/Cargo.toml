[package]
name = "ares"
version.workspace = true
edition.workspace = true
license.workspace = true

# The compiler is also a C library: `libares.a` and `libares.so` (C API in
# `include/ares.h`), which a native program links when it uses the compiler's
# builtins at run time.
[lib]
path = "src/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "ares"
path = "src/main.rs"

[dependencies]
utilities = { path = "../utilities" }
frontend = { path = "../frontend" }
interpreter = { path = "../interpreter" }
ccg = { path = "../ccg" }
